services:
  postgres:
    image: postgres:16
    container_name: sueldos_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sueldos
      POSTGRES_PASSWORD: sueldos123
      POSTGRES_DB: sueldos
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgresql:/docker-entrypoint-initdb.d   # ejecuta los .sql al crear el contenedor
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sueldos -d sueldos"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
